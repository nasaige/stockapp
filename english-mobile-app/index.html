<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>跨境物流英语手机练习</title>
    <link rel="manifest" href="./manifest.json" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f2;
        --ink: #111827;
        --muted: #667085;
        --line: #d9dfd1;
        --card: #fffdf8;
        --brand: #0f766e;
        --brand-2: #2563eb;
        --warn: #b45309;
        --bad: #dc2626;
        --good: #15803d;
        --shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      button, input { font: inherit; }
      .app {
        max-width: 720px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 12px 14px calc(88px + env(safe-area-inset-bottom));
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        margin: 0 -14px;
        padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
        background: rgba(246, 247, 242, 0.94);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }
      .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      h1 { margin: 0; font-size: 19px; line-height: 1.15; letter-spacing: 0; }
      h2 { margin: 0 0 10px; font-size: 17px; }
      h3 { margin: 0; font-size: 15px; }
      p { margin: 0; }
      .muted { color: var(--muted); }
      .tiny { font-size: 12px; }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 5px 9px;
        border-radius: 999px;
        background: #e8f3f1;
        color: #0f766e;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .card {
        margin: 12px 0;
        padding: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }
      .grid { display: grid; gap: 10px; }
      .stats { grid-template-columns: repeat(4, 1fr); }
      .stat {
        min-width: 0;
        padding: 10px 6px;
        border-radius: 12px;
        background: #f0f4ea;
        text-align: center;
      }
      .stat b { display: block; font-size: 19px; }
      .stat span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
      .tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        max-width: 720px;
        margin: 0 auto;
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        background: rgba(255, 253, 248, 0.96);
        border-top: 1px solid var(--line);
        backdrop-filter: blur(16px);
      }
      .tabs button {
        min-height: 52px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .tabs button.on { background: #e8f3f1; color: var(--brand); }
      .screen { display: none; }
      .screen.on { display: block; }
      .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .btn, .icon-btn {
        border: 0;
        border-radius: 12px;
        background: var(--brand);
        color: white;
        font-weight: 800;
        min-height: 46px;
        padding: 10px 12px;
      }
      .btn.secondary { background: #e9eefb; color: #1d4ed8; }
      .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
      .btn.warn { background: #fff7ed; color: var(--warn); }
      .btn.bad { background: #fef2f2; color: var(--bad); }
      .icon-btn {
        width: 42px;
        min-height: 42px;
        padding: 0;
        border-radius: 50%;
      }
      .word {
        margin-top: 4px;
        font-size: clamp(34px, 12vw, 58px);
        line-height: 1.02;
        font-weight: 900;
        word-break: break-word;
      }
      .meaning {
        min-height: 48px;
        margin-top: 10px;
        color: #344054;
        font-size: 15px;
        line-height: 1.45;
      }
      .input {
        width: 100%;
        min-height: 52px;
        margin-top: 12px;
        padding: 12px 14px;
        border: 1px solid #b9c2b0;
        border-radius: 12px;
        background: white;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0;
        outline: none;
      }
      .input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14); }
      .progress {
        height: 8px;
        overflow: hidden;
        border-radius: 99px;
        background: #e5e7eb;
      }
      .progress > span { display: block; height: 100%; width: 0; background: var(--brand); transition: width 0.2s ease; }
      .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: white;
        color: #344054;
        min-height: 36px;
        padding: 7px 10px;
        font-size: 13px;
        font-weight: 700;
      }
      .chip.on { border-color: var(--brand); background: #e8f3f1; color: var(--brand); }
      .list { display: grid; gap: 10px; }
      .item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
      }
      .item strong { display: block; font-size: 17px; }
      .item small { display: block; margin-top: 3px; color: var(--muted); line-height: 1.35; }
      .search {
        width: 100%;
        min-height: 44px;
        margin-bottom: 10px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
        outline: none;
      }
      .ipa-grid { grid-template-columns: repeat(2, 1fr); }
      .ipa-card {
        min-height: 86px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
      }
      .ipa-card b { display: block; color: var(--brand-2); font-size: 24px; }
      .notice {
        margin-top: 10px;
        padding: 10px;
        border-radius: 12px;
        background: #fff7ed;
        color: #7c2d12;
        font-size: 13px;
        line-height: 1.45;
      }
      @media (max-width: 370px) {
        .stats { grid-template-columns: repeat(2, 1fr); }
        .tabs button { font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="bar">
          <div>
            <h1>跨境物流英语</h1>
            <p class="muted tiny">手机练习版 · 本地记录 · 英文朗读</p>
          </div>
          <button id="speakCurrent" class="icon-btn" aria-label="朗读当前单词">听</button>
        </div>
      </header>

      <main id="home" class="screen on">
        <section class="card">
          <div class="bar">
            <h2>今日练习</h2>
            <span class="pill" id="todayLabel">本地保存</span>
          </div>
          <div class="grid stats">
            <div class="stat"><b id="todayWords">0</b><span>今日词数</span></div>
            <div class="stat"><b id="streakDays">0</b><span>连续天数</span></div>
            <div class="stat"><b id="bestWpm">0</b><span>最佳 WPM</span></div>
            <div class="stat"><b id="reviewCount">0</b><span>待复习</span></div>
          </div>
          <div class="notice">打开就是练习，不需要登录。数据只存在你手机浏览器里。</div>
        </section>
        <section class="card">
          <h2>选择练习方式</h2>
          <div class="chip-wrap">
            <button class="chip on" data-mode="type">看中文打英文</button>
            <button class="chip" data-mode="listen">听音打英文</button>
            <button class="chip" data-mode="card">闪卡记忆</button>
          </div>
          <div class="btn-row" style="margin-top: 12px">
            <button class="btn" onclick="startSession()">开始 10 词</button>
            <button class="btn secondary" onclick="openScreen('dict')">查词库</button>
          </div>
        </section>
        <section class="card">
          <h2>高频工作短语</h2>
          <div class="list" id="phraseList"></div>
        </section>
      </main>

      <main id="practice" class="screen">
        <section class="card">
          <div class="bar">
            <span class="pill" id="modeLabel">看中文打英文</span>
            <span class="muted tiny" id="stepLabel">0 / 10</span>
          </div>
          <div class="progress" style="margin-top: 12px"><span id="progressBar"></span></div>
          <div class="word" id="wordText">SKU</div>
          <p class="meaning" id="meaningText">stock keeping unit</p>
          <input id="answerInput" class="input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入英文..." />
          <div class="btn-row" style="margin-top: 12px">
            <button class="btn" onclick="checkAnswer()">提交</button>
            <button class="btn ghost" onclick="speakWord(current.name)">朗读</button>
          </div>
          <div class="btn-row" style="margin-top: 10px">
            <button class="btn warn" onclick="markReview()">加入复习</button>
            <button class="btn bad" onclick="skipWord()">跳过</button>
          </div>
          <p class="notice" id="feedback">按开始后会随机抽 10 个工作词。</p>
        </section>
      </main>

      <main id="dict" class="screen">
        <section class="card">
          <h2>物流/跨境电商词库</h2>
          <input id="search" class="search" placeholder="搜索 SKU、waybill、清关..." oninput="renderDict()" />
          <div class="list" id="dictList"></div>
        </section>
      </main>

      <main id="ipa" class="screen">
        <section class="card">
          <h2>零基础音标入口</h2>
          <p class="muted tiny">不用先背符号，先听例词。点卡片会朗读例词。</p>
          <div class="grid ipa-grid" id="ipaList" style="margin-top: 12px"></div>
        </section>
      </main>

      <main id="review" class="screen">
        <section class="card">
          <div class="bar">
            <h2>复习本</h2>
            <button class="chip" onclick="clearReview()">清空</button>
          </div>
          <div class="list" id="reviewList"></div>
        </section>
      </main>
    </div>

    <nav class="tabs">
      <button class="on" data-target="home">首页</button>
      <button data-target="practice">练习</button>
      <button data-target="dict">词库</button>
      <button data-target="ipa">音标</button>
      <button data-target="review">复习</button>
    </nav>

    <script>
      const dictUrl = '../english-ios-app/dicts/logistics_cross_border_ecommerce.json'
      const fallbackWords = [
        { name: 'SKU', trans: ['stock keeping unit'] },
        { name: 'waybill', trans: ['shipping document for a parcel or freight shipment'] },
        { name: 'customs clearance', trans: ['process of passing goods through customs'] },
        { name: 'fulfillment', trans: ['pick, pack, and ship process after an order is placed'] },
        { name: 'warehouse', trans: ['storage place for inventory'] },
        { name: 'tracking number', trans: ['number used to track a parcel'] },
        { name: 'commercial invoice', trans: ['invoice used for customs declaration'] },
        { name: 'packing list', trans: ['document listing carton and product details'] },
        { name: 'last mile delivery', trans: ['final delivery from local station to customer'] },
        { name: 'freight forwarder', trans: ['company arranging freight transportation'] },
      ]
      const phrases = [
        ['Please provide the tracking number.', '请提供物流单号。'],
        ['The parcel is waiting for customs clearance.', '包裹正在等待清关。'],
        ['We need the commercial invoice and packing list.', '我们需要商业发票和装箱单。'],
        ['The order has been fulfilled by the warehouse.', '订单已由仓库履约。'],
        ['There is a delivery exception today.', '今天出现派送异常。'],
      ]
      const ipa = [
        ['/i:/, /i/', 'see / sit', 'see sit'],
        ['/e/, /ae/', 'pen / cat', 'pen cat'],
        ['/u:/, /u/', 'blue / book', 'blue book'],
        ['/ei/, /ai/', 'day / bike', 'day bike'],
        ['/th/, /dh/', 'thank / this', 'thank this'],
        ['/sh/, /ch/', 'ship / chair', 'ship chair'],
        ['/ng/, /n/', 'sing / name', 'sing name'],
        ['/r/, /l/', 'right / light', 'right light'],
      ]
      const storeKey = 'mobile-logistics-english-v1'
      let words = fallbackWords
      let mode = 'type'
      let session = []
      let index = 0
      let current = fallbackWords[0]
      let startedAt = Date.now()
      let state = readState()

      function todayKey() {
        const d = new Date()
        return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-')
      }
      function readState() {
        try { return JSON.parse(localStorage.getItem(storeKey)) || {} } catch { return {} }
      }
      function saveState() {
        localStorage.setItem(storeKey, JSON.stringify(state))
        renderStats()
      }
      function normalize(s) {
        return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ')
      }
      function speakWord(text, rate = 0.86) {
        if (!('speechSynthesis' in window)) return
        speechSynthesis.cancel()
        const u = new SpeechSynthesisUtterance(text)
        u.lang = 'en-US'
        u.rate = rate
        speechSynthesis.speak(u)
      }
      function meaningOf(word) {
        return Array.isArray(word.trans) ? word.trans.join(' / ') : String(word.trans || '')
      }
      function openScreen(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.toggle('on', el.id === id))
        document.querySelectorAll('.tabs button').forEach(btn => btn.classList.toggle('on', btn.dataset.target === id))
        if (id === 'dict') renderDict()
        if (id === 'review') renderReview()
        window.scrollTo({ top: 0, behavior: 'smooth' })
      }
      function renderStats() {
        const today = todayKey()
        const todayStats = state.days?.[today] || { words: 0, bestWpm: 0 }
        document.getElementById('todayWords').textContent = todayStats.words || 0
        document.getElementById('bestWpm').textContent = todayStats.bestWpm || 0
        document.getElementById('reviewCount').textContent = Object.keys(state.review || {}).length
        document.getElementById('streakDays').textContent = calcStreak()
        document.getElementById('todayLabel').textContent = today
      }
      function calcStreak() {
        const days = state.days || {}
        const d = new Date(todayKey())
        let count = 0
        while (days[d.toISOString().slice(0, 10)]?.words > 0) {
          count++
          d.setDate(d.getDate() - 1)
        }
        return count
      }
      function renderPhrases() {
        document.getElementById('phraseList').innerHTML = phrases.map(([en, zh]) => `
          <div class="item">
            <div><strong>${en}</strong><small>${zh}</small></div>
            <button class="icon-btn" onclick="speakWord('${en.replace(/'/g, "\\'")}')">听</button>
          </div>
        `).join('')
      }
      function setMode(next) {
        mode = next
        document.querySelectorAll('[data-mode]').forEach(btn => btn.classList.toggle('on', btn.dataset.mode === mode))
      }
      function startSession() {
        session = [...words].sort(() => Math.random() - 0.5).slice(0, 10)
        index = 0
        startedAt = Date.now()
        current = session[0] || words[0]
        openScreen('practice')
        renderPractice()
      }
      function renderPractice() {
        current = session[index] || current || words[0]
        const showWord = mode !== 'listen'
        document.getElementById('modeLabel').textContent = mode === 'listen' ? '听音打英文' : mode === 'card' ? '闪卡记忆' : '看中文打英文'
        document.getElementById('stepLabel').textContent = `${Math.min(index + 1, session.length || 1)} / ${session.length || 10}`
        document.getElementById('progressBar').style.width = `${session.length ? (index / session.length) * 100 : 0}%`
        document.getElementById('wordText').textContent = showWord ? current.name : '听后输入'
        document.getElementById('meaningText').textContent = mode === 'type' ? meaningOf(current) : mode === 'card' ? meaningOf(current) : '点朗读，听到什么就输入什么'
        document.getElementById('answerInput').value = ''
        document.getElementById('answerInput').style.display = mode === 'card' ? 'none' : 'block'
        document.getElementById('feedback').textContent = mode === 'card' ? '记住就点提交，没记住加入复习。' : '输入英文后点提交，大小写不影响。'
        if (mode === 'listen') setTimeout(() => speakWord(current.name), 250)
      }
      function checkAnswer() {
        if (!session.length) startSession()
        if (mode === 'card') return finishWord(true)
        const input = normalize(document.getElementById('answerInput').value)
        const answer = normalize(current.name)
        if (input === answer) {
          document.getElementById('feedback').textContent = '正确。'
          speakWord(current.name)
          finishWord(true)
        } else {
          document.getElementById('feedback').textContent = `还差一点：${current.name}`
          markReview(false)
        }
      }
      function finishWord(countIt) {
        if (countIt) {
          const today = todayKey()
          state.days = state.days || {}
          state.days[today] = state.days[today] || { words: 0, bestWpm: 0 }
          state.days[today].words += 1
          const minutes = Math.max((Date.now() - startedAt) / 60000, 0.2)
          state.days[today].bestWpm = Math.max(state.days[today].bestWpm || 0, Math.round((index + 1) / minutes))
          saveState()
        }
        index += 1
        if (index >= session.length) {
          document.getElementById('progressBar').style.width = '100%'
          document.getElementById('wordText').textContent = '完成'
          document.getElementById('meaningText').textContent = '今天又多熟悉了一组工作词。'
          document.getElementById('answerInput').style.display = 'none'
          document.getElementById('feedback').textContent = '可以继续一组，或者去复习本巩固错词。'
          return
        }
        setTimeout(renderPractice, 450)
      }
      function skipWord() {
        markReview(false)
        finishWord(false)
      }
      function markReview(show = true) {
        state.review = state.review || {}
        state.review[current.name] = current
        saveState()
        if (show) document.getElementById('feedback').textContent = '已加入复习本。'
      }
      function renderDict() {
        const q = normalize(document.getElementById('search').value)
        const list = words.filter(w => normalize(w.name + ' ' + meaningOf(w)).includes(q)).slice(0, 80)
        document.getElementById('dictList').innerHTML = list.map(w => `
          <div class="item">
            <div><strong>${w.name}</strong><small>${meaningOf(w)}</small></div>
            <button class="icon-btn" onclick="speakWord('${w.name.replace(/'/g, "\\'")}')">听</button>
          </div>
        `).join('')
      }
      function renderReview() {
        const list = Object.values(state.review || {})
        document.getElementById('reviewList').innerHTML = list.length ? list.map(w => `
          <div class="item">
            <div><strong>${w.name}</strong><small>${meaningOf(w)}</small></div>
            <button class="icon-btn" onclick="speakWord('${w.name.replace(/'/g, "\\'")}')">听</button>
          </div>
        `).join('') : '<p class="muted">复习本是空的，练习时点“加入复习”。</p>'
      }
      function clearReview() {
        state.review = {}
        saveState()
        renderReview()
      }
      function renderIpa() {
        document.getElementById('ipaList').innerHTML = ipa.map(([symbol, sample, speech]) => `
          <button class="ipa-card" onclick="speakWord('${speech}')">
            <b>${symbol}</b>
            <span>${sample}</span>
          </button>
        `).join('')
      }
      async function loadWords() {
        try {
          const res = await fetch(dictUrl, { cache: 'no-store' })
          if (!res.ok) throw new Error('dict load failed')
          const data = await res.json()
          if (Array.isArray(data) && data.length) words = data
        } catch {
          words = fallbackWords
        }
        current = words[0]
        renderDict()
        renderPractice()
      }
      document.querySelectorAll('.tabs button').forEach(btn => btn.addEventListener('click', () => openScreen(btn.dataset.target)))
      document.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)))
      document.getElementById('answerInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer() })
      document.getElementById('speakCurrent').addEventListener('click', () => speakWord(current.name))
      renderStats()
      renderPhrases()
      renderIpa()
      loadWords()
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(() => {})
    </script>
  </body>
</html>
