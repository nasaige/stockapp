<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>英语词库手机练习</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root{color-scheme:light;--bg:#f6f7f2;--ink:#111827;--muted:#667085;--line:#d9dfd1;--card:#fffdf8;--brand:#0f766e;--blue:#2563eb;--warn:#b45309;--bad:#dc2626;--shadow:0 14px 30px rgba(15,23,42,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.app{max-width:720px;min-height:100vh;margin:0 auto;padding:12px 14px calc(88px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:5;margin:0 -14px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(246,247,242,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:19px;line-height:1.15}h2{margin:0 0 10px;font-size:17px}p{margin:0}.muted{color:var(--muted)}.tiny{font-size:12px}.card{margin:12px 0;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.pill{display:inline-flex;align-items:center;min-height:28px;padding:5px 9px;border-radius:999px;background:#e8f3f1;color:#0f766e;font-size:12px;font-weight:800;white-space:nowrap}.grid{display:grid;gap:10px}.stats{grid-template-columns:repeat(4,1fr)}.stat{min-width:0;padding:10px 6px;border-radius:12px;background:#f0f4ea;text-align:center}.stat b{display:block;font-size:19px}.stat span{display:block;margin-top:2px;color:var(--muted);font-size:11px}.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,253,248,.96);border-top:1px solid var(--line);backdrop-filter:blur(16px)}.tabs button{min-height:52px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:12px;font-weight:800}.tabs button.on{background:#e8f3f1;color:var(--brand)}.screen{display:none}.screen.on{display:block}.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn,.icon-btn{border:0;border-radius:12px;background:var(--brand);color:white;font-weight:900;min-height:46px;padding:10px 12px}.btn.secondary{background:#e9eefb;color:#1d4ed8}.btn.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.btn.warn{background:#fff7ed;color:var(--warn)}.btn.bad{background:#fef2f2;color:var(--bad)}.icon-btn{width:42px;min-height:42px;padding:0;border-radius:50%}.word{margin-top:4px;font-size:clamp(34px,12vw,58px);line-height:1.02;font-weight:950;word-break:break-word}.meaning{min-height:48px;margin-top:10px;color:#344054;font-size:15px;line-height:1.45}.input,.search,.select{width:100%;min-height:48px;padding:10px 12px;border:1px solid #b9c2b0;border-radius:12px;background:white;outline:none}.input{margin-top:12px;font-size:22px;font-weight:850}.search{margin-bottom:10px}.select{margin:8px 0 10px;font-weight:800}.progress{height:8px;overflow:hidden;border-radius:99px;background:#e5e7eb}.progress>span{display:block;height:100%;width:0;background:var(--brand);transition:width .2s ease}.chip-wrap{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);border-radius:999px;background:white;color:#344054;min-height:36px;padding:7px 10px;font-size:13px;font-weight:800}.chip.on{border-color:var(--brand);background:#e8f3f1;color:var(--brand)}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.item strong{display:block;font-size:17px}.item small{display:block;margin-top:3px;color:var(--muted);line-height:1.35}.ipa-grid{grid-template-columns:repeat(2,1fr)}.ipa-card{min-height:86px;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.ipa-card b{display:block;color:var(--blue);font-size:24px}.notice{margin-top:10px;padding:10px;border-radius:12px;background:#fff7ed;color:#7c2d12;font-size:13px;line-height:1.45}@media(max-width:370px){.stats{grid-template-columns:repeat(2,1fr)}.tabs button{font-size:11px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><div class="bar"><div><h1>英语词库手机练习</h1><p class="muted tiny">开源全词库 · 本地记录 · 英文朗读</p></div><button id="speakCurrent" class="icon-btn" aria-label="朗读当前单词">听</button></div></header>
    <main id="home" class="screen on">
      <section class="card"><div class="bar"><h2>今日练习</h2><span class="pill" id="todayLabel">本地保存</span></div><div class="grid stats"><div class="stat"><b id="todayWords">0</b><span>今日词数</span></div><div class="stat"><b id="streakDays">0</b><span>连续天数</span></div><div class="stat"><b id="bestWpm">0</b><span>最佳 WPM</span></div><div class="stat"><b id="reviewCount">0</b><span>待复习</span></div></div><div class="notice">数据保存在你当前手机浏览器里，不需要登录。</div></section>
      <section class="card"><div class="bar"><h2>选择开源词库</h2><span class="pill" id="catalogCount">加载中</span></div><input id="catalogSearch" class="search" placeholder="搜索 雅思 / 新概念 / CET4 / CET6 / TOEFL / GRE / 考研" oninput="renderCatalog()" /><select id="dictSelect" class="select" onchange="chooseDict(this.value)"></select><p class="muted tiny" id="dictStatus">正在读取全部词库目录...</p></section>
      <section class="card"><h2>选择练习方式</h2><div class="chip-wrap"><button class="chip on" data-mode="type">看释义打英文</button><button class="chip" data-mode="listen">听音打英文</button><button class="chip" data-mode="card">闪卡记忆</button></div><div class="btn-row" style="margin-top:12px"><button class="btn" onclick="startSession()">开始 10 词</button><button class="btn secondary" onclick="openScreen('dict')">查当前词库</button></div></section>
      <section class="card"><h2>常用入口</h2><div class="chip-wrap" id="quickList"></div></section>
    </main>
    <main id="practice" class="screen"><section class="card"><div class="bar"><span class="pill" id="modeLabel">看释义打英文</span><span class="muted tiny" id="stepLabel">0 / 10</span></div><div class="progress" style="margin-top:12px"><span id="progressBar"></span></div><div class="word" id="wordText">CET4</div><p class="meaning" id="meaningText">先选择词库，然后开始练习。</p><input id="answerInput" class="input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入英文..." /><div class="btn-row" style="margin-top:12px"><button class="btn" onclick="checkAnswer()">提交</button><button class="btn ghost" onclick="speakWord(current.name)">朗读</button></div><div class="btn-row" style="margin-top:10px"><button class="btn warn" onclick="markReview()">加入复习</button><button class="btn bad" onclick="skipWord()">跳过</button></div><p class="notice" id="feedback">按开始后会随机抽 10 个词。</p></section></main>
    <main id="dict" class="screen"><section class="card"><div class="bar"><h2>当前词库</h2><span class="pill" id="activeDictLabel">CET4</span></div><input id="search" class="search" placeholder="搜索当前词库里的单词或释义..." oninput="renderDict()" /><div class="list" id="dictList"></div></section></main>
    <main id="ipa" class="screen"><section class="card"><h2>零基础音标入口</h2><p class="muted tiny">先听例词，不用先背符号。点卡片会朗读例词。</p><div class="grid ipa-grid" id="ipaList" style="margin-top:12px"></div></section></main>
    <main id="review" class="screen"><section class="card"><div class="bar"><h2>复习本</h2><button class="chip" onclick="clearReview()">清空</button></div><div class="list" id="reviewList"></div></section></main>
  </div>
  <nav class="tabs"><button class="on" data-target="home">首页</button><button data-target="practice">练习</button><button data-target="dict">词库</button><button data-target="ipa">音标</button><button data-target="review">复习</button></nav>
  <script>
    const dictBase = '../english-ios-app/dicts/'
    const catalogApi = 'https://api.github.com/repos/nasaige/stockapp/contents/english-ios-app/dicts?ref=gh-pages'
    const fallbackCatalog = ['CET4_T.json','CET6_T.json','IELTS_3_T.json','TOEFL_3_T.json','KaoYan_3_T.json','NCE_1.json','NCE_2.json','NCE_3.json','NCE_4.json','GRE_3_T.json','GMAT_3_T.json','BEC_2_T.json','BEC_3_T.json','GaoKao_3500.json']
    const fallbackWords = [{name:'abandon',trans:['放弃']},{name:'ability',trans:['能力']},{name:'academic',trans:['学术的']},{name:'access',trans:['进入；使用权']},{name:'accurate',trans:['准确的']},{name:'achieve',trans:['实现；达到']},{name:'benefit',trans:['好处；受益']},{name:'challenge',trans:['挑战']},{name:'describe',trans:['描述']},{name:'evidence',trans:['证据']}]
    const ipa = [['/i:/, /i/','see / sit','see sit'],['/e/, /ae/','pen / cat','pen cat'],['/u:/, /u/','blue / book','blue book'],['/ei/, /ai/','day / bike','day bike'],['/th/, /dh/','thank / this','thank this'],['/sh/, /ch/','ship / chair','ship chair'],['/ng/, /n/','sing / name','sing name'],['/r/, /l/','right / light','right light']]
    const storeKey = 'mobile-full-dict-english-v2'
    const quick = ['CET4_T.json','CET6_T.json','IELTS_3_T.json','TOEFL_3_T.json','KaoYan_3_T.json','NCE_1.json','NCE_2.json','NCE_3.json','NCE_4.json','GRE_3_T.json']
    let catalog = []
    let words = fallbackWords
    let mode = 'type'
    let activeDict = localStorage.getItem('active-dict-file') || 'CET4_T.json'
    let session = []
    let index = 0
    let current = fallbackWords[0]
    let startedAt = Date.now()
    let state = readState()
    function todayKey(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
    function readState(){try{return JSON.parse(localStorage.getItem(storeKey))||{}}catch{return {}}}
    function saveState(){localStorage.setItem(storeKey,JSON.stringify(state));renderStats()}
    function cleanName(file){return file.replace(/\.json$/,'').replace(/_/g,' ').replace(/-/g,' ')}
    function normalize(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
    function meaningOf(w){return Array.isArray(w.trans)?w.trans.join(' / '):String(w.trans||w.translation||w.meaning||w.definition||'')}
    function wordName(w){return String(w.name||w.word||w.content||w.text||'')}
    function normalizeWords(data){const list=Array.isArray(data)?data:(data.words||data.data||[]);return list.map(x=>({name:wordName(x),trans:Array.isArray(x.trans)?x.trans:[meaningOf(x)]})).filter(x=>x.name).slice(0,5000)}
    function speakWord(text,rate=.86){if(!('speechSynthesis'in window)||!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}
    function openScreen(id){document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('on',el.id===id));document.querySelectorAll('.tabs button').forEach(btn=>btn.classList.toggle('on',btn.dataset.target===id));if(id==='dict')renderDict();if(id==='review')renderReview();window.scrollTo({top:0,behavior:'smooth'})}
    function renderStats(){const today=todayKey();const s=state.days?.[today]||{words:0,bestWpm:0};todayWords.textContent=s.words||0;bestWpm.textContent=s.bestWpm||0;reviewCount.textContent=Object.keys(state.review||{}).length;streakDays.textContent=calcStreak();todayLabel.textContent=today}
    function calcStreak(){const days=state.days||{};const d=new Date(todayKey());let count=0;while(days[d.toISOString().slice(0,10)]?.words>0){count++;d.setDate(d.getDate()-1)}return count}
    function renderCatalog(){const q=normalize(catalogSearch.value);const selected=catalog.filter(f=>normalize(f+' '+cleanName(f)).includes(q)).slice(0,250);dictSelect.innerHTML=selected.map(f=>`<option value="${f}" ${f===activeDict?'selected':''}>${cleanName(f)}</option>`).join('');catalogCount.textContent=`${catalog.length} 个词库`}
    function renderQuick(){quickList.innerHTML=quick.map(f=>`<button class="chip" onclick="chooseDict('${f}')">${cleanName(f)}</button>`).join('')}
    async function loadCatalog(){try{const res=await fetch(catalogApi,{cache:'no-store'});if(!res.ok)throw new Error('catalog');const data=await res.json();catalog=data.filter(x=>x.name&&x.name.endsWith('.json')).map(x=>x.name).sort((a,b)=>a.localeCompare(b))}catch{catalog=fallbackCatalog}if(!catalog.includes(activeDict))activeDict=catalog.includes('CET4_T.json')?'CET4_T.json':catalog[0];renderCatalog();renderQuick();await chooseDict(activeDict)}
    async function chooseDict(file){activeDict=file;localStorage.setItem('active-dict-file',file);dictStatus.textContent=`正在加载：${cleanName(file)}`;activeDictLabel.textContent=cleanName(file);renderCatalog();try{const res=await fetch(dictBase+encodeURIComponent(file),{cache:'no-store'});if(!res.ok)throw new Error('dict');words=normalizeWords(await res.json());if(!words.length)throw new Error('empty');dictStatus.textContent=`已加载 ${cleanName(file)}，共 ${words.length} 个词`}catch{words=fallbackWords;dictStatus.textContent='词库暂时加载失败，已使用备用基础词。'}current=words[0];session=[];renderPractice();renderDict()}
    function setMode(next){mode=next;document.querySelectorAll('[data-mode]').forEach(btn=>btn.classList.toggle('on',btn.dataset.mode===mode))}
    function startSession(){session=[...words].sort(()=>Math.random()-.5).slice(0,10);index=0;startedAt=Date.now();current=session[0]||words[0];openScreen('practice');renderPractice()}
    function renderPractice(){current=session[index]||current||words[0];const showWord=mode!=='listen';modeLabel.textContent=mode==='listen'?'听音打英文':mode==='card'?'闪卡记忆':'看释义打英文';stepLabel.textContent=`${Math.min(index+1,session.length||1)} / ${session.length||10}`;progressBar.style.width=`${session.length?(index/session.length)*100:0}%`;wordText.textContent=showWord?current.name:'听后输入';meaningText.textContent=mode==='listen'?'点朗读，听到什么就输入什么':meaningOf(current);answerInput.value='';answerInput.style.display=mode==='card'?'none':'block';feedback.textContent=mode==='card'?'记住就点提交，没记住加入复习。':'输入英文后点提交，大小写不影响。';if(mode==='listen')setTimeout(()=>speakWord(current.name),250)}
    function checkAnswer(){if(!session.length)startSession();if(mode==='card')return finishWord(true);const input=normalize(answerInput.value);const answer=normalize(current.name);if(input===answer){feedback.textContent='正确。';speakWord(current.name);finishWord(true)}else{feedback.textContent=`还差一点：${current.name}`;markReview(false)}}
    function finishWord(countIt){if(countIt){const today=todayKey();state.days=state.days||{};state.days[today]=state.days[today]||{words:0,bestWpm:0};state.days[today].words+=1;const minutes=Math.max((Date.now()-startedAt)/60000,.2);state.days[today].bestWpm=Math.max(state.days[today].bestWpm||0,Math.round((index+1)/minutes));saveState()}index+=1;if(index>=session.length){progressBar.style.width='100%';wordText.textContent='完成';meaningText.textContent='这一组练完了，可以继续下一组或复习错词。';answerInput.style.display='none';feedback.textContent='完成。';return}setTimeout(renderPractice,450)}
    function skipWord(){markReview(false);finishWord(false)}
    function markReview(show=true){state.review=state.review||{};state.review[current.name]=current;saveState();if(show)feedback.textContent='已加入复习本。'}
    function renderDict(){const q=normalize(search.value);const list=words.filter(w=>normalize(w.name+' '+meaningOf(w)).includes(q)).slice(0,100);dictList.innerHTML=list.map(w=>`<div class="item"><div><strong>${w.name}</strong><small>${meaningOf(w)}</small></div><button class="icon-btn" onclick="speakWord('${w.name.replace(/'/g,"\\'")}')">听</button></div>`).join('')}
    function renderReview(){const list=Object.values(state.review||{});reviewList.innerHTML=list.length?list.map(w=>`<div class="item"><div><strong>${w.name}</strong><small>${meaningOf(w)}</small></div><button class="icon-btn" onclick="speakWord('${w.name.replace(/'/g,"\\'")}')">听</button></div>`).join(''):'<p class="muted">复习本是空的，练习时点“加入复习”。</p>'}
    function clearReview(){state.review={};saveState();renderReview()}
    function renderIpa(){ipaList.innerHTML=ipa.map(([symbol,sample,speech])=>`<button class="ipa-card" onclick="speakWord('${speech}')"><b>${symbol}</b><span>${sample}</span></button>`).join('')}
    document.querySelectorAll('.tabs button').forEach(btn=>btn.addEventListener('click',()=>openScreen(btn.dataset.target)))
    document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>setMode(btn.dataset.mode)))
    answerInput.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()})
    speakCurrent.addEventListener('click',()=>speakWord(current.name))
    renderStats();renderIpa();loadCatalog();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{})
  </script>
</body>
</html>
