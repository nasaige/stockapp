<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>跨境物流英语手机练习</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f2;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.box{padding:24px;text-align:center}.spinner{width:34px;height:34px;margin:0 auto 14px;border:4px solid #d9dfd1;border-top-color:#0f766e;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}button{margin-top:14px;border:0;border-radius:12px;background:#0f766e;color:white;font-weight:800;min-height:44px;padding:10px 16px}</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>跨境物流英语</h1>
    <p>正在打开手机练习版...</p>
    <button onclick="loadApp()">重新加载</button>
  </div>
  <script>
    async function loadApp() {
      try {
        const url = 'https://raw.githubusercontent.com/nasaige/stockapp/gh-pages/english-mobile-app/index.html?v=' + Date.now()
        const res = await fetch(url)
        if (!res.ok) throw new Error('load failed')
        let html = await res.text()
        html = html.replace("const dictUrl = '../english-ios-app/dicts/logistics_cross_border_ecommerce.json'", "const dictUrl = 'https://nasaige.github.io/stockapp/english-ios-app/dicts/logistics_cross_border_ecommerce.json'")
        document.open()
        document.write(html)
        document.close()
      } catch (error) {
        document.querySelector('p').textContent = '网络刷新中，请点重新加载。'
      }
    }
    loadApp()
  </script>
</body>
</html>
