name: Deploy Qwerty English App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-qwerty-english-app.cjs
      - .github/workflows/deploy-qwerty-english-app.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build customized Qwerty Learner site
        run: node scripts/build-qwerty-english-app.cjs
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-ios-app
          git diff --cached --quiet && exit 0
          git commit -m "Deploy customized qwerty learner app"
          git push
