name: Deploy Qwerty English App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-qwerty-english-app.cjs
      - .github/workflows/deploy-qwerty-english-app.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build original Qwerty Learner site
        run: node scripts/build-qwerty-english-app.cjs
      - name: Commit generated site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-ios-app
          git diff --cached --quiet || git commit -m "Deploy original qwerty learner app"
          git pull --rebase origin main
          git push origin main
      - name: Publish generated site to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add ../gh-pages gh-pages
          rm -rf ../gh-pages/english-ios-app
          cp -R english-ios-app ../gh-pages/english-ios-app
          cd ../gh-pages
          git add english-ios-app
          git diff --cached --quiet && exit 0
          git commit -m "Deploy original qwerty learner app"
          git pull --rebase origin gh-pages
          git push origin gh-pages
