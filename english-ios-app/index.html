.", "zh": "记得。Apple 是苹果。"}, {"speaker": "A", "en": "Great. Make a sentence.", "zh": "很好。造个句子。"}]}, {"id": "d_021", "scene": "daily", "title": "旅行", "turns": [{"speaker": "A", "en": "Where do you want to travel?", "zh": "你想去哪里旅行？"}, {"speaker": "B", "en": "I want to visit London.", "zh": "我想去伦敦。"}, {"speaker": "A", "en": "You need useful English.", "zh": "你需要实用英语。"}]}, {"id": "d_022", "scene": "daily", "title": "雅思口语1", "turns": [{"speaker": "A", "en": "Do you work or study?", "zh": "你工作还是学习？"}, {"speaker": "B", "en": "I study English at home.", "zh": "我在家学英语。"}, {"speaker": "A", "en": "What do you study every day?", "zh": "你每天学什么？"}]}, {"id": "d_023", "scene": "daily", "title": "雅思口语2", "turns": [{"speaker": "A", "en": "Describe a useful app.", "zh": "描述一个有用的应用。"}, {"speaker": "B", "en": "This app helps me learn English.", "zh": "这个应用帮助我学英语。"}, {"speaker": "A", "en": "It has words, sentences and audio.", "zh": "它有单词、句子和音频。"}]}, {"id": "d_024", "scene": "daily", "title": "雅思观点", "turns": [{"speaker": "A", "en": "Do you agree with online learning?", "zh": "你同意在线学习吗？"}, {"speaker": "B", "en": "Yes, because it is flexible.", "zh": "同意，因为它很灵活。"}, {"speaker": "A", "en": "Give one example.", "zh": "举一个例子。"}]}, {"id": "d_025", "scene": "daily", "title": "图表描述", "turns": [{"speaker": "A", "en": "The number increased slowly.", "zh": "数字缓慢上升。"}, {"speaker": "B", "en": "What does increased mean?", "zh": "increased 是什么意思？"}, {"speaker": "A", "en": "It means went up.", "zh": "意思是上升。"}]}, {"id": "d_026", "scene": "daily", "title": "比较", "turns": [{"speaker": "A", "en": "Which is better, books or videos?", "zh": "书和视频哪个更好？"}, {"speaker": "B", "en": "Both are useful.", "zh": "两者都有用。"}, {"speaker": "A", "en": "Books help reading, videos help listening.", "zh": "书帮助阅读，视频帮助听力。"}]}, {"id": "d_027", "scene": "daily", "title": "建议", "turns": [{"speaker": "A", "en": "How can I improve pronunciation?", "zh": "我怎么提高发音？"}, {"speaker": "B", "en": "Listen, repeat, and record yourself.", "zh": " let page=1,gpos=0,progress=JSON.parse(localStorage.getItem('p')||'{}');progress.mistakes=progress.mistakes||{};function save(){localStorage.setItem('p',JSON.stringify(progress))}function sp(t,r=.82){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;speechSynthesis.speak(u)}function openTab(t){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(t).classList.add('on');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='words')renderWords();if(t==='phonetics')renderIpa();if(t==='grammar')renderGrammar();if(t==='sentences')renderSent();if(t==='practice')startPractice()}function renderHome(){mods.innerHTML=['完整词库','48音标','主谓宾拆句','句库对话'].map((m,i)=>`<div class=card><h3>${m}</h3><p>全部开放，无锁定。</p></div>`).join('')}function renderWords(){let q=(search.value||'').toLowerCase(),list=wordBank.filter(w=>(w.word+w.meaning+w.category).toLowerCase().includes(q));wc.textContent=`显示 ${Math.min(page*30,list.length)} / ${list.length}`;wordList.innerHTML=list.slice(0,page*30).map(w=>`<div class=item><b>${w.word}</b> <span class=ipa>${w.phonetic}</span><div class=cn>${w.meaning} · ${w.partOfSpeech}</div><div>${w.example}<br><span class=cn>${w.exampleZh}</span></div><div><button class=btn onclick="sp('${w.word}',.72)">听单词</button><button class="btn ghost" onclick="sp('${w.word}',.65)">慢速</button><button class="btn blue" onclick="sp('${w.example}',.82)">听例句</button></div><p><b>搭配：</b>${w.collocations.join(' / ')}<br><b>近义词：</b>${w.synonyms.length?w.synonyms.join(' / '):'暂无常用同义词'}<br><b>反义词：</b>${w.antonyms.length?w.antonyms.join(' / '):'暂无常用反义词'}<br><b>派生词：</b>${w.derivatives.length?w.derivatives.join(' / '):'暂无常用派生词'}</p></div>`).join('')}function renderIpa(){ipaList.innerHTML=phoneticBank.map(p=>`<div class=card><span class=tag>${p.type}</span><div class=word>${p.symbol}</div><p>${p.chineseHint}</p><p class=muted>${p.mouthTip}</p><button class=btn onclick="sp('${p.representativeSound}',.65)">听示范音</button><button class="btn ghost" onclick="sp('${p.contrast.exampleA}',.72);setTimeout(()=>sp('${p.contrast.exampleB}',.72),900)">听易混对比</button>${p.representativeWords.map(w=>`<div class=item><b>${w.word}</b> <span class=ipa>${w.phonetic}</span><div class=cn>${w.meaning}</div><button class="btn ghost" onclick="sp('${w.word}',.72)">听例词</button><button class="btn blue" onclick="sp('${w.example}',.82)">听例句</button></div>`).join('')}</div>`).join('')}function renderGrammar(){let g=grammarBank[gpos];gi.textContent=`${gpos+1}/${grammarBank.length}`;grammarBox.innerHTML=`<div class=card><h3>${g.sentence}</h3><p>${g.translation}</p><div>${g.parts.map((p,i)=>`<button class="part ${p.role}" onclick="exp.innerHTML='<b>${p.text} = ${p.role}</b><br>${p.explanation}'">${p.text}<br>${p.role}</button>`).join('')}</div><div id=exp class=item>点击词或短语查看解释。</div><button class="btn ghost" onclick="gpos=(gpos-1+grammarBank.length)%grammarBank.length;renderGrammar()">上一句</button><button class="btn ghost" onclick="gpos=(gpos+1)%grammarBank.length;renderGrammar()">下一句</button><button class=btn onclick="sp('${g.sentence}',.75)">慢速听句</button><button class="btn blue" onclick="sp('${g.sentence}',.95)">正常听句</button></div>`}function renderSent(){sentList.innerHTML=sentenceBank.map(s=>`<div class=item><b>${s.sentence}</b><div class=cn>${s.translation}</div><button class=btn onclick="sp('${s.sentence}',.75)">慢速句子</button><button class="btn blue" onclick="sp('${s.sentence}',.95)">正常句子</button></div>`).join('')+dialogueBank.map(d=>`<div class=card><h3>${d.title}</h3>${d.turns.map(t=>`<p><b>${t.speaker}:</b> ${t.en}<br><span class=cn>${t.zh}</span></p>`).join('')}</div>`).join('')}let prac=[];function startPractice(){prac=wordBank.sort(()=>Math.random()-.5).slice(0,10);practiceBox.innerHTML=prac.map(w=>`<div class=item><b>${w.meaning}</b><p>选择英文：${w.word}</p><button class=btn onclick="sp('${w.word}',.72)">听</button></div>`).join('')}renderHome();renderWords();renderIpa();renderGrammar();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
